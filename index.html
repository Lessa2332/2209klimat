<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2418">
<meta name="color-scheme" content="light">
<title>🌿 Записник природи</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{
  --leaf-900:#0f2418; --leaf-800:#1a3a26; --leaf-700:#245233;
  --leaf-600:#2f6b42; --leaf-500:#3d8b57; --leaf-400:#5cab72;
  --leaf-300:#8fd3a4; --leaf-200:#c8ebd3; --leaf-100:#eefaf1;
  --sun:#ffb703; --sun-soft:#ffd166;
  --water:#4cc9f0; --water-soft:#a8e6ff;
  --earth:#a8763e;
  --paper:#fdfcf8; --paper-line:#dde7f0; --paper-grid:#e4eef7;
  --ink:#1f2a24; --ink-dim:#5c6b62; --ink-mute:#8a9a90;
  --danger:#e63946;
  --line:rgba(15,36,24,.12);
  --line-strong:rgba(15,36,24,.24);
  --shadow-1:0 2px 8px rgba(15,36,24,.08);
  --shadow-2:0 10px 28px rgba(15,36,24,.14);
  --shadow-3:0 20px 60px rgba(15,36,24,.22);
  --dur:.18s; --ease:cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Nunito",
         "Noto Sans",Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);font-size:16px;line-height:1.45;
  color:var(--ink);background:var(--leaf-100);overflow:hidden;
  overscroll-behavior:none;height:100vh;height:100dvh;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

.app{
  display:grid;height:100vh;height:100dvh;width:100%;
  grid-template-columns:320px 1fr;
  grid-template-rows:auto 1fr;
  transition:grid-template-columns .25s var(--ease);
}
.app.drawer-collapsed{grid-template-columns:0 1fr}

/* ─── HEADER ─── */
.header{
  grid-column:1/-1;
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  background:linear-gradient(180deg,#2f6b42,#1a3a26);
  color:#fff;z-index:30;box-shadow:var(--shadow-1);
  position:relative;
}
.menu-btn{
  width:42px;height:42px;flex:0 0 auto;border-radius:12px;
  background:rgba(255,255,255,.15);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;transition:background var(--dur);
}
.menu-btn:hover{background:rgba(255,255,255,.25)}
.menu-btn:active{transform:scale(.94)}
.header__title{
  display:flex;align-items:center;gap:8px;
  font-size:clamp(14px,3.4vw,18px);font-weight:800;letter-spacing:-.01em;
  margin:0;flex:0 1 auto;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.header__title-icon{font-size:1.2em}
.header__name{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.14);border-radius:10px;
  padding:4px 10px;
}
.header__name label{font-size:11px;text-transform:uppercase;opacity:.75;letter-spacing:.05em;font-weight:700}
.header__name input{
  flex:1;min-width:0;background:transparent;border:0;color:#fff;
  font-weight:700;font-size:14.5px;padding:4px 2px;outline:none;
}
.header__name input::placeholder{color:rgba(255,255,255,.55)}
.header__controls{display:flex;gap:6px;flex:0 0 auto}
.hbtn{
  width:42px;height:42px;border-radius:12px;
  background:rgba(255,255,255,.15);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all var(--dur);
}
.hbtn:hover{background:rgba(255,255,255,.28)}
.hbtn:active{transform:scale(.94)}
.hbtn--primary{background:linear-gradient(135deg,var(--sun),#ff9500);color:#25180a;font-weight:700}
.hbtn-wrap{position:relative;display:inline-flex}
.net-dot{
  width:9px;height:9px;border-radius:50%;
  background:#7ee2a8;box-shadow:0 0 8px #7ee2a8;
  position:absolute;top:5px;right:5px;pointer-events:none;
  border:1.5px solid #1a3a26;
}
.net-dot[data-online="false"]{background:#ff8a8a;box-shadow:0 0 8px #ff8a8a}
.net-dot[data-online="unknown"]{background:#ffd166;box-shadow:0 0 8px #ffd166}

@media (max-width:640px){
  .header__title-text{display:none}
  .header__name label{display:none}
  .header__name{padding:4px 8px}
  .hbtn,.menu-btn{width:38px;height:38px;font-size:16px}
}

/* ─── DRAWER ─── */
.drawer{
  grid-column:1;grid-row:2;
  background:#fff;border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
  min-width:0;transition:transform .25s var(--ease);
  z-index:25;box-shadow:var(--shadow-2);
}
.app.drawer-collapsed .drawer{transform:translateX(-100%);pointer-events:none}

.drawer__inner{padding:14px;display:flex;flex-direction:column;gap:16px;min-width:320px}
.dsection{display:flex;flex-direction:column;gap:8px}
.dsection__title{
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--leaf-700);display:flex;align-items:center;gap:6px;
  padding-bottom:6px;border-bottom:1.5px solid var(--leaf-200);
}
.dsection__title-icon{font-size:14px}

.icon-tabs{
  display:flex;gap:4px;padding:3px;border-radius:10px;
  background:var(--leaf-100);overflow-x:auto;scrollbar-width:none;
  flex-wrap:nowrap;
}
.icon-tabs::-webkit-scrollbar{display:none}
.icon-tab{
  flex:1 0 auto;padding:7px 10px;border-radius:7px;
  font-size:11.5px;font-weight:800;color:var(--leaf-700);
  white-space:nowrap;transition:all var(--dur);
}
.icon-tab:hover{background:var(--leaf-200)}
.icon-tab.on{background:var(--leaf-600);color:#fff;box-shadow:0 2px 6px rgba(47,107,66,.35)}

.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icon-pick{
  aspect-ratio:1;border-radius:10px;font-size:24px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:var(--leaf-100);border:1.5px solid transparent;
  cursor:pointer;transition:all var(--dur);user-select:none;
}
.icon-pick:hover{background:var(--leaf-200);border-color:var(--leaf-400);transform:translateY(-2px)}
.icon-pick:active{transform:scale(.92)}

.tool-row{display:flex;gap:6px;flex-wrap:wrap}
.tool-chip{
  flex:1 1 0;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:9px 8px;border-radius:10px;
  font-size:12px;font-weight:800;
  background:var(--leaf-100);color:var(--leaf-700);
  border:1.5px solid transparent;transition:all var(--dur);
}
.tool-chip:hover{background:var(--leaf-200)}
.tool-chip[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--leaf-500),var(--leaf-700));
  color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(47,107,66,.3);
}
.tool-chip__icon{font-size:15px}

.color-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.color-swatches{display:flex;gap:4px;flex-wrap:wrap}
.color-sw{
  width:28px;height:28px;border-radius:50%;
  border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);
  cursor:pointer;transition:transform var(--dur);flex:0 0 auto;
}
.color-sw:hover{transform:scale(1.1)}
.color-sw.on{outline:3px solid var(--leaf-600);outline-offset:2px}
.color-custom{
  width:28px;height:28px;border-radius:50%;padding:0;border:2.5px solid #fff;
  -webkit-appearance:none;appearance:none;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.color-custom::-webkit-color-swatch-wrapper{padding:0}
.color-custom::-webkit-color-swatch{border:0;border-radius:50%}

.size-row{display:flex;align-items:center;gap:10px}
.size-row input[type="range"]{
  flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;
}
.size-row input[type="range"]::-webkit-slider-runnable-track{
  height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--leaf-300),var(--leaf-700));
}
.size-row input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  margin-top:-8px;background:#fff;border:3px solid var(--leaf-600);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.size-row input[type="range"]::-moz-range-track{height:6px;border-radius:999px;background:var(--leaf-400)}
.size-row input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--leaf-600)}
.size-val{min-width:28px;text-align:center;font-weight:800;color:var(--leaf-700);font-size:13px}

.action-btn{
  display:flex;align-items:center;gap:8px;
  padding:11px 14px;border-radius:12px;
  font-size:13.5px;font-weight:800;
  background:var(--leaf-100);color:var(--leaf-700);
  border:1.5px solid transparent;width:100%;text-align:left;
  transition:all var(--dur);
}
.action-btn:hover{background:var(--leaf-200);border-color:var(--leaf-400)}
.action-btn:active{transform:scale(.98)}
.action-btn__icon{font-size:17px;flex:0 0 auto}
.action-btn--primary{
  background:linear-gradient(135deg,var(--sun),#ff9500);
  color:#25180a;box-shadow:0 3px 10px rgba(255,183,3,.3);
}
.action-btn--primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--sun),#ff9500)}
.action-btn--danger{color:var(--danger);background:#fdeaea}
.action-btn--danger:hover{background:#fbd5d5}

.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bg-opt{
  padding:10px 8px;border-radius:10px;font-size:12px;font-weight:800;
  background:var(--leaf-100);color:var(--leaf-700);
  border:1.5px solid transparent;transition:all var(--dur);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.bg-opt__swatch{
  width:100%;height:32px;border-radius:6px;
  border:1px solid var(--line-strong);background:var(--paper);
}
.bg-opt__swatch--line{
  background:repeating-linear-gradient(180deg,transparent 0 7px,var(--paper-line) 7px 8px),var(--paper);
}
.bg-opt__swatch--grid{
  background:
    repeating-linear-gradient(0deg,transparent 0 7px,var(--paper-grid) 7px 8px),
    repeating-linear-gradient(90deg,transparent 0 7px,var(--paper-grid) 7px 8px),
    var(--paper);
}
.bg-opt__swatch--white{background:#fff}
.bg-opt__swatch--sky{background:linear-gradient(180deg,#c8e8ff,#eef8ff)}
.bg-opt__swatch--forest{background:linear-gradient(180deg,#d4ecd9,#f2faf4)}
.bg-opt.on{background:linear-gradient(135deg,var(--leaf-500),var(--leaf-700));color:#fff;border-color:transparent}
.bg-opt.on .bg-opt__swatch{border-color:rgba(255,255,255,.6)}

/* ─── WORKSPACE ─── */
.workspace{
  grid-column:2;grid-row:2;
  position:relative;overflow:hidden;
  background:var(--paper);
  display:flex;flex-direction:column;min-width:0;min-height:0;
}
.board-wrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.board{position:absolute;inset:0;transition:background .25s var(--ease)}
.board[data-bg="line"]{
  background:var(--paper);
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--paper-line) 27px 28px);
}
.board[data-bg="grid"]{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 27px,var(--paper-grid) 27px 28px),
    repeating-linear-gradient(90deg,transparent 0 27px,var(--paper-grid) 27px 28px);
}
.board[data-bg="white"]{background:#fff}
.board[data-bg="sky"]{background:linear-gradient(180deg,#c8e8ff 0%,#eef8ff 100%)}
.board[data-bg="forest"]{background:linear-gradient(180deg,#d4ecd9 0%,#f2faf4 100%)}

#drawCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;z-index:2;display:block;
  -webkit-user-select:none;user-select:none;cursor:crosshair;
}
#drawCanvas[data-tool="idle"]{pointer-events:none;cursor:default}
#drawCanvas[data-tool="eraser"]{cursor:cell}

#objectsLayer{
  position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;
}

/* ─── ОБ'ЄКТИ ─── */
.obj{
  position:absolute;pointer-events:auto;
  user-select:none;-webkit-user-select:none;touch-action:none;
  transition:box-shadow .15s;
}
.obj.dragging{z-index:1000 !important;filter:drop-shadow(0 12px 24px rgba(0,0,0,.28))}
.obj.selected{outline:2px dashed var(--leaf-500);outline-offset:4px;border-radius:6px}

/* Іконка */
.obj-icon{
  display:flex;align-items:center;justify-content:center;
  line-height:1;padding:4px;cursor:grab;font-size:48px;
}
.obj-icon:active{cursor:grabbing}

/* ─── ТЕКСТ (нова структура з textarea) ─── */
.obj-text{
  min-width:80px;max-width:90%;
  position:relative;
  display:flex;flex-direction:column;
  border-radius:10px;
}
.obj-text__input{
  width:100%;
  padding:8px 12px;
  border:2px solid transparent;border-radius:10px;
  background:transparent;
  color:inherit;font-family:inherit;font-size:inherit;font-weight:700;
  line-height:1.25;outline:none;resize:none;overflow:hidden;
  min-height:1.6em;
  -webkit-user-select:text;user-select:text;
  touch-action:manipulation;
  transition:border-color .15s, background .15s;
  caret-color:var(--leaf-700);
}
.obj-text__input::placeholder{color:rgba(15,36,24,.35);font-weight:600}
.obj-text.selected .obj-text__input{
  border-color:var(--leaf-300);background:rgba(255,255,255,.7);
}
.obj-text__input:focus{
  border-color:var(--sun) !important;
  background:rgba(255,255,255,.95) !important;
  box-shadow:0 0 0 3px rgba(255,183,3,.2);
}
.obj-text__drag,
.obj-text__resize{
  position:absolute;width:32px;height:32px;
  border-radius:50%;
  background:#fff;border:2.5px solid var(--leaf-600);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  display:none;align-items:center;justify-content:center;
  touch-action:none;z-index:5;
  font-size:13px;font-weight:900;color:var(--leaf-700);
  user-select:none;
}
.obj-text.selected .obj-text__drag,
.obj-text.selected .obj-text__resize{display:flex}
.obj-text__drag{top:-16px;left:-16px;cursor:grab}
.obj-text__drag:active{cursor:grabbing}
.obj-text__drag::before{content:'✥'}
.obj-text__resize{bottom:-16px;right:-16px;cursor:nwse-resize}
.obj-text__resize::before{content:'⤡'}

/* ─── СТІКЕР ─── */
.obj-sticker{
  border-radius:12px;padding:0;overflow:hidden;
  display:flex;flex-direction:column;
  min-width:120px;
  box-shadow:var(--shadow-2);
  cursor:grab;color:#1b2733;width:180px;
  position:relative;
}
.obj-sticker__bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:2px 4px 2px 8px;min-height:26px;
  background:rgba(0,0,0,.08);cursor:grab;
}
.obj-sticker__grip{
  font-size:14px;font-weight:900;color:rgba(27,39,51,.4);
  letter-spacing:-2px;pointer-events:none;
}
.obj-sticker__del{
  width:26px;height:26px;border-radius:6px;
  color:rgba(27,39,51,.55);font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.obj-sticker__del:hover{background:rgba(230,57,70,.9);color:#fff}
.obj-sticker__text{
  flex:1;padding:6px 10px 10px;
  font-size:13px;font-weight:600;line-height:1.4;
  background:transparent;border:0;outline:none;resize:none;
  font-family:var(--font);color:inherit;
  overflow:hidden;display:block;width:100%;
  -webkit-user-select:text;user-select:text;
  touch-action:manipulation;
}
.obj-sticker__text::placeholder{color:rgba(27,39,51,.4)}
.obj-sticker__resize{
  position:absolute;width:22px;height:22px;
  background:#fff;border:2.5px solid var(--leaf-600);
  border-radius:50%;right:-10px;bottom:-10px;
  cursor:nwse-resize;touch-action:none;z-index:5;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  opacity:0;transition:opacity var(--dur);
}
.obj-sticker.selected .obj-sticker__resize{opacity:1}
.obj-icon__resize{
  position:absolute;width:22px;height:22px;
  background:#fff;border:2.5px solid var(--leaf-600);
  border-radius:50%;right:-10px;bottom:-10px;
  cursor:nwse-resize;touch-action:none;z-index:5;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  opacity:0;transition:opacity var(--dur);
}
.obj-icon.selected .obj-icon__resize{opacity:1}

/* ─── QUICK BAR ─── */
.quick-bar{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  display:none;gap:4px;padding:6px;
  background:rgba(255,255,255,.96);
  border:1px solid var(--line-strong);border-radius:16px;
  box-shadow:var(--shadow-3);
  z-index:20;backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  max-width:calc(100% - 24px);
}
.quick-btn{
  width:46px;height:46px;border-radius:12px;
  font-size:20px;display:flex;align-items:center;justify-content:center;
  color:var(--leaf-700);background:transparent;
  transition:all var(--dur);flex:0 0 auto;
}
.quick-btn:hover{background:var(--leaf-100)}
.quick-btn[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--leaf-500),var(--leaf-700));
  color:#fff;
}

/* ─── МОБІЛЬНА ВЕРСІЯ — критично важлива частина ─── */
@media (max-width:1024px){
  .quick-bar{display:flex}

  /* Drawer як overlay */
  .drawer{
    position:fixed !important;
    top:0 !important;left:0 !important;bottom:0 !important;
    width:320px !important;max-width:88vw !important;
    height:100vh !important;height:100dvh !important;
    transform:translateX(-100%) !important;
    transition:transform .25s var(--ease), visibility .25s !important;
    visibility:hidden !important;
    pointer-events:none !important;
    z-index:9998 !important;
    grid-column:unset !important;grid-row:unset !important;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:4px 0 30px rgba(0,0,0,.4);
    overflow-y:auto !important;
  }
  .app.drawer-open .drawer{
    transform:translateX(0) !important;
    visibility:visible !important;
    pointer-events:auto !important;
  }
  .app.drawer-collapsed .drawer{
    transform:translateX(-100%) !important;
    visibility:hidden !important;
    pointer-events:none !important;
  }

  .app{grid-template-columns:1fr}
  .app.drawer-collapsed{grid-template-columns:1fr}
  .workspace{grid-column:1;grid-row:2}

  /* Backdrop */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(15,36,24,.55);
    z-index:9997 !important;
    opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease);
  }
  .app.drawer-open .drawer-backdrop{opacity:1;pointer-events:auto}
}

@media (min-width:1025px){
  .drawer-backdrop{display:none}
  .quick-bar{display:none}
}

@media (max-width:640px){
  .obj-text{max-width:92%}
  .obj-sticker{width:150px}
  .obj-icon{font-size:40px}
}

/* ─── AUTHOR ─── */
.author-line{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  z-index:10;
}
.author-credit{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:6px;
  font-size:10px;font-weight:600;letter-spacing:.04em;
  color:rgba(15,36,24,.4);cursor:pointer;
  transition:all .2s;user-select:none;
  background:rgba(255,255,255,.6);backdrop-filter:blur(6px);
}
.author-credit:hover{color:var(--leaf-700);background:#fff}

/* ─── МОДАЛКА ─── */
.modal-back{
  position:fixed;inset:0;z-index:10000;
  background:rgba(15,36,24,.55);backdrop-filter:blur(6px);

/* ═══════════ КОНСТАНТИ ═══════════ */
const NATURE_ICONS = {
  sky:     { label:'Небо',    icons:['☀️','🌤️','⛅','🌥️','☁️','🌙','⭐','🌟','✨','🌌','🌠','☄️'] },

  animals: { label:'Тварини', icons:['🦋','🐝','🐞','🐦','🦊','🐻','🐸','🐟','🦌','🐇','🐿️','🦔','🐌','🐛','🐜','🦉','🐺','🦅','🐢','🐍','🦎','🦆','🐠','🐙','🐬','🦈','🐋'] },
  land:    { label:'Рельєф',  icons:['🏔️','⛰️','🌋','🪨','🌄','🌅','🏜️','🏞️','🏝️','🏕️','🕳️','⛲','🌉','🏰'] },
  water:   { label:'Вода',    icons:['🌊','💧','🏞️','🐚','🦀','🦐','🐠','🐡','🐙','🦑','🐬','🦈','🐳','🐋','⛵','🚤'] }
};

const COLOR_SWATCHES = [
  '#1f2a24', '#5a3e2b', '#a8763e', '#e63946',
  '#ff6b35', '#ffb703', '#84cc16', '#2f6b42',
  '#4cc9f0', '#3a86ff', '#8338ec', '#e91e8c',
  '#ffffff', '#8a9a90'
];

const STICKER_COLORS = ['#ffe066','#a8e6cf','#ffb4a2','#c8e8ff','#e8d5ff','#ffd6a5','#d4f1c9','#ffcad4'];

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAIqa_MF4sevTfg7Za8Fly3EK97dVYm_Q8",
  authDomain: "realtime-6af79.firebaseapp.com",
  databaseURL: "https://realtime-6af79-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "realtime-6af79",
  storageBucket: "realtime-6af79.firebasestorage.app",
  messagingSenderId: "154142013253",
  appId: "1:154142013253:web:2b3bfde1a8ecea5565f02c"
};

const BOARD_PATH = 'notebook/main';
const CLIENT_ID = Math.random().toString(36).slice(2, 11);

/* ═══════════ DOM ═══════════ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

const app            = $('#app');
const drawer         = $('#drawer');
const drawerBackdrop = $('#drawerBackdrop');
const menuBtn        = $('#menuBtn');
const board          = $('#board');
const boardWrap      = $('#boardWrap');
const canvas         = $('#drawCanvas');
const ctx            = canvas.getContext('2d', { alpha:true });
const objectsLayer   = $('#objectsLayer');
const iconTabs       = $('#iconTabs');
const iconGrid       = $('#iconGrid');
const toolRow        = $('#toolRow');
const colorSwatches  = $('#colorSwatches');
const colorCustom    = $('#colorCustom');
const brushSizeEl    = $('#brushSize');
const sizeValEl      = $('#sizeVal');
const bgGrid         = $('#bgGrid');
const toastEl        = $('#toast');
const netDot         = $('#netDot');
const authorInput    = $('#authorNameInput');
const adminPanel     = $('#adminPanel');
const adminProgress  = $('#adminProgress');
const adminProgressText = $('#adminProgressText');
const adminProgressFill = $('#adminProgressFill');

/* ═══════════ СТАН ═══════════ */
const state = {
  data: { canvas:null, icons:[], texts:[], stickers:[], background:'line', name:'' },
  tool: 'idle',
  color: '#2f6b42',
  size: 5,
  activeIconTab: 'sky',
  selectedObjId: null,
  drawing: false,
  lastX: 0, lastY: 0,
  dirty: false,
  saveTimer: null,
  lastLocalCanvas: null,
  pendingCanvas: undefined,
  db: null,
  ref: null,
  handler: null,
  listenersActive: false,
  isOnline: false,
  adminBusy: false,
  suppressSave: false
};

let dpr = 1;
let canvasRenderToken = 0;
let resizeRaf = null;

/* ═══════════ УТИЛІТИ ═══════════ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function showToast(msg, ms=2200){
  toastEl.textContent = msg;
  toastEl.dataset.show = 'true';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toastEl.dataset.show = 'false'; }, ms);
}
function setAdminProgress(text, percent){
  if (text === null){ adminProgress.dataset.show = 'false'; return; }
  adminProgress.dataset.show = 'true';
  adminProgressText.textContent = text;
  adminProgressFill.style.width = (percent || 0) + '%';
}
function emptyData(){
  return { canvas:null, icons:[], texts:[], stickers:[], background:'line', name:'' };
}
function isMobile(){ return window.innerWidth < 1025; }

/* ═══════════ FIREBASE ═══════════ */
function initFirebase(){
  try {
    if (typeof firebase === 'undefined') throw new Error('Firebase SDK не завантажено');
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    state.db = firebase.database();
    state.ref = state.db.ref(BOARD_PATH);
    return true;
  } catch (err){ console.warn('[Firebase]', err); return false; }
}

function attachFirebaseListeners(){
  if (!state.db || !state.ref) return;
  state.handler = state.ref.on('value', snap => {
    const data = snap.val();
    if (!data) return;
    if (state.dirty) return;
    applyRemoteData(data);
  }, err => { console.warn('[Sync]', err); netDot.dataset.online = 'false'; });
  state.listenersActive = true;

  state.db.ref('.info/connected').on('value', snap => {
    const online = !!snap.val();
    state.isOnline = online;
    netDot.dataset.online = online ? 'true' : 'false';
    netDot.title = online ? 'Онлайн' : 'Офлайн';
  });
}

function applyRemoteData(data){
  if (Array.isArray(data.icons)) state.data.icons = data.icons;
  if (Array.isArray(data.texts)) state.data.texts = data.texts;
  if (Array.isArray(data.stickers)) state.data.stickers = data.stickers;
  if (data.background) state.data.background = data.background;
  if (typeof data.name === 'string') state.data.name = data.name;
  if (authorInput) authorInput.value = state.data.name;
  board.dataset.bg = state.data.background || 'line';
  updateBgButtons();
  renderAllObjects();

  // Малюнок
  const url = data.drawing || null;
  if (url !== state.lastLocalCanvas){
    state.data.canvas = url;
    state.lastLocalCanvas = url;
    renderCanvas(url);
  }
}

function scheduleSave(){
  state.dirty = true;
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(() => flushSave(), 500);
}

/* ОСНОВНЕ ВИПРАВЛЕННЯ: update() для головного + завжди set() на drawing */
function flushSave(opts = {}){
  if (!state.db || !state.ref) return;
  if (!state.dirty && !opts.force) return;

  const payload = {
    icons: state.data.icons,
    texts: state.data.texts,
    stickers: state.data.stickers,
    background: state.data.background,
    name: state.data.name,
    updatedAt: Date.now(),
    by: CLIENT_ID
  };

  // update() НЕ видаляє інші поля (drawing залишається, якщо його не чіпати)
  state.ref.update(payload).then(() => {
    state.dirty = false;
  }).catch(err => {
    console.warn('[Save]', err);
    setTimeout(() => { state.dirty = true; flushSave(); }, 1500);
  });

  // drawing завжди синхронізуємо окремо — null очищає малюнок
  state.lastLocalCanvas = state.data.canvas || null;
  state.ref.child('drawing').set(state.data.canvas || null).catch(err => {
    console.warn('[Save drawing]', err);
  });
}

function forceSyncNow(){
  if (!state.db || !state.ref){ showToast('❌ Синхронізація недоступна'); return; }
  showToast('🔄 Синхронізація…');
  state.dirty = true;
  flushSave({ force:true });
  state.ref.once('value').then(snap => {
    const data = snap.val();
    if (data) applyRemoteData(data);
    showToast('✅ Готово');
  }).catch(err => {
    console.warn('[Sync]', err);
    showToast('⚠️ Помилка синхронізації');
  });
}

/* ═══════════ ФОН ═══════════ */
function setBackground(bg){
  state.data.background = bg;
  board.dataset.bg = bg;
  updateBgButtons();
  state.dirty = true;
  scheduleSave();
}
function updateBgButtons(){
  $$('.bg-opt').forEach(b => b.classList.toggle('on', b.dataset.bg === state.data.background));
}

/* ═══════════ ПОЛОТНО ═══════════ */
function resizeCanvasBacking(){
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  if (w < 1 || h < 1) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.round(w * dpr);
  const ch = Math.round(h * dpr);
  if (canvas.width === cw && canvas.height === ch) return;
  canvas.width = cw;
  canvas.height = ch;
  renderCanvas(state.data.canvas);
}

function renderCanvas(url){
  const token = ++canvasRenderToken;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!url) return;
  const img = new Image();
  img.onload = () => {
    if (token !== canvasRenderToken) return;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = url;
}

function encodeCanvas(){
  try {
    const webp = canvas.toDataURL('image/webp', 0.82);
    if (webp && webp.indexOf('data:image/webp') === 0) return webp;
  } catch(_){}
  return canvas.toDataURL('image/png');
}

function getCanvasPoint(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX||0) - r.left, y: (e.clientY||0) - r.top };
}
function beginStroke(x, y){
  if (state.tool !== 'brush' && state.tool !== 'eraser') return;
  state.drawing = true;
  state.lastX = x; state.lastY = y;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = state.size;
  if (state.tool === 'eraser') ctx.globalCompositeOperation = 'destination-out';
  else { ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = state.color; }
  ctx.beginPath();
  ctx.arc(x, y, state.size/2, 0, Math.PI*2);
  ctx.fillStyle = state.tool === 'eraser' ? 'rgba(0,0,0,1)' : state.color;
  ctx.fill();
}
function moveStroke(x, y){
  if (!state.drawing) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = state.size;
  if (state.tool === 'eraser'){ ctx.globalCompositeOperation = 'destination-out'; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
  else { ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = state.color; }
  ctx.beginPath();
  ctx.moveTo(state.lastX, state.lastY);
  ctx.lineTo(x, y);
  ctx.stroke();
  state.lastX = x; state.lastY = y;
}
function endStroke(){
  if (!state.drawing) return;
  state.drawing = false;
  ctx.globalCompositeOperation = 'source-over';
  state.data.canvas = encodeCanvas();
  state.lastLocalCanvas = state.data.canvas;
  state.dirty = true;
  scheduleSave();
}
function attachCanvasEvents(){
  canvas.addEventListener('pointerdown', e => {
    if (state.tool !== 'brush' && state.tool !== 'eraser') return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    const p = getCanvasPoint(e);
    beginStroke(p.x, p.y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!state.drawing) return;
    e.preventDefault();
    moveStroke(getCanvasPoint(e).x, getCanvasPoint(e).y);
  });
  canvas.addEventListener('pointerup', () => endStroke());
  canvas.addEventListener('pointercancel', () => endStroke());
  canvas.addEventListener('pointerleave', () => { if (state.drawing) endStroke(); });
}

/* ═══════════ ОБ'ЄКТИ ═══════════ */
function clearSelection(){
  if (state.selectedObjId){
    const el = document.querySelector(`.obj[data-id="${state.selectedObjId}"]`);
    if (el) el.classList.remove('selected');
    state.selectedObjId = null;
  }
}
function selectObj(id){
  clearSelection();
  state.selectedObjId = id;
  const el = document.querySelector(`.obj[data-id="${id}"]`);
  if (el) el.classList.add('selected');
}
function getVisibleCenter(){
  const r = boardWrap.getBoundingClientRect();
  return { x: Math.round(r.width/2 - 60), y: Math.round(r.height/2 - 30) };
}

/* ─── ІКОНКА ─── */
function createIconEl(icon){
  const el = document.createElement('div');
  el.className = 'obj obj-icon';
  el.dataset.id = icon.id;
  el.dataset.kind = 'icon';
  el.style.left = icon.x + 'px';
  el.style.top = icon.y + 'px';
  el.style.fontSize = (icon.size || 48) + 'px';
  el.textContent = icon.emoji;
  el.title = 'Перетягни. Подвійний тап — видалити.';

  const handle = document.createElement('div');
  handle.className = 'obj-icon__resize';
  el.appendChild(handle);

  attachDrag(el, icon, 'icon');
  attachResize(handle, el, icon, 'icon');

  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    removeObj(icon.id, 'icon');
  });
  return el;
}

/* ─── ТЕКСТ (textarea + драг-хендл) ─── */
function createTextEl(item){
  const el = document.createElement('div');
  el.className = 'obj obj-text';
  el.dataset.id = item.id;
  el.dataset.kind = 'text';
  el.style.left = item.x + 'px';
  el.style.top = item.y + 'px';
  el.style.fontSize = (item.fontSize || 22) + 'px';
  el.style.color = item.color || '#1f2a24';

  const ta = document.createElement('textarea');
  ta.className = 'obj-text__input';
  ta.value = item.text || '';
  ta.placeholder = 'Текст…';
  ta.rows = 1;
  ta.spellcheck = false;
  ta.style.color = item.color || '#1f2a24';

  const dragHandle = document.createElement('div');
  dragHandle.className = 'obj-text__drag';
  dragHandle.title = 'Перетягнути';

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'obj-text__resize';
  resizeHandle.title = 'Змінити розмір';

  el.append(ta, dragHandle, resizeHandle);

  attachDrag(el, item, 'text', dragHandle);
  attachResize(resizeHandle, el, item, 'text');

  ta.addEventListener('input', () => {
    item.text = ta.value;
    autoSizeTextArea(ta);
    state.dirty = true;
    scheduleSave();
  });
  ta.addEventListener('focus', () => selectObj(item.id));
  ta.addEventListener('pointerdown', e => e.stopPropagation());
  ta.addEventListener('pointermove', e => e.stopPropagation());
  ta.addEventListener('keydown', e => e.stopPropagation());

  requestAnimationFrame(() => autoSizeTextArea(ta));
  return el;
}
function autoSizeTextArea(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, 30) + 'px';
}

/* ─── СТІКЕР ─── */
function createStickerEl(st){
  const el = document.createElement('div');
  el.className = 'obj obj-sticker';
  el.dataset.id = st.id;
  el.dataset.kind = 'sticker';
  el.style.left = st.x + 'px';
  el.style.top = st.y + 'px';
  el.style.background = st.color || STICKER_COLORS[0];
  el.style.width = (st.width || 180) + 'px';
  el.style.color = '#1b2733';

  const bar = document.createElement('div');
  bar.className = 'obj-sticker__bar';
  const grip = document.createElement('span');
  grip.className = 'obj-sticker__grip';
  grip.textContent = '⋮⋮';
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'obj-sticker__del';
  del.textContent = '✕';
  del.setAttribute('aria-label', 'Видалити');
  bar.append(grip, del);

  const ta = document.createElement('textarea');
  ta.className = 'obj-sticker__text';
  ta.value = st.text || '';
  ta.placeholder = 'Пиши тут…';
  ta.rows = 3;

  const handle = document.createElement('div');
  handle.className = 'obj-sticker__resize';

  el.append(bar, ta, handle);

  attachDrag(el, st, 'sticker', bar);
  attachResize(handle, el, st, 'sticker');

  del.addEventListener('click', e => {
    e.stopPropagation(); e.preventDefault();
    removeObj(st.id, 'sticker');
  });
  ta.addEventListener('input', () => {
    st.text = ta.value;
    state.dirty = true;
    scheduleSave();
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 240) + 'px';
  });
  ta.addEventListener('pointerdown', e => e.stopPropagation());
  ta.addEventListener('keydown', e => e.stopPropagation());

  requestAnimationFrame(() => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 240) + 'px';
  });
  return el;
}

/* ─── DRAG ─── */
function attachDrag(el, item, kind, handleEl){
  const dragTarget = handleEl || el;
  let start = null;

  function startDrag(e){
    if (e.target.closest('.obj-sticker__del, .obj-sticker__text, .obj-text__input, .obj-text__resize, .obj-icon__resize, .obj-sticker__resize')) return;
    selectObj(item.id);
    start = { x:e.clientX, y:e.clientY, l:item.x, t:item.y };
    el.classList.add('dragging');
    try { dragTarget.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation(); e.preventDefault();
  }
  function moveDrag(e){
    if (!start) return;
    item.x = Math.max(-40, start.l + (e.clientX - start.x));
    item.y = Math.max(-40, start.t + (e.clientY - start.y));
    el.style.left = item.x + 'px';
    el.style.top = item.y + 'px';
  }
  function endDrag(){
    if (!start) return;
    start = null;
    el.classList.remove('dragging');
    state.dirty = true;
    scheduleSave();
  }
  dragTarget.addEventListener('pointerdown', startDrag);
  dragTarget.addEventListener('pointermove', moveDrag);
  dragTarget.addEventListener('pointerup', endDrag);
  dragTarget.addEventListener('pointercancel', endDrag);
}

/* ─── RESIZE ─── */
function attachResize(handle, el, item, kind){
  let start = null;
  handle.addEventListener('pointerdown', e => {
    e.stopPropagation(); e.preventDefault();
    selectObj(item.id);
    start = {
      x: e.clientX, y: e.clientY,
      baseSize: kind === 'text' ? (item.fontSize||22) : kind === 'icon' ? (item.size||48) : (item.width||180)
    };
    try { handle.setPointerCapture(e.pointerId); } catch(_){}
  });
  handle.addEventListener('pointermove', e => {
    if (!start) return;
    e.stopPropagation();
    const d = ((e.clientX - start.x) + (e.clientY - start.y)) / 2;
    if (kind === 'text'){
      const s = Math.max(10, Math.min(140, start.baseSize + d * 0.6));
      item.fontSize = s; el.style.fontSize = s + 'px';
    } else if (kind === 'icon'){
      const s = Math.max(20, Math.min(200, start.baseSize + d * 0.8));
      item.size = s; el.style.fontSize = s + 'px';
    } else {
      const w = Math.max(100, Math.min(400, start.baseSize + (e.clientX - start.x)));
      item.width = w; el.style.width = w + 'px';
    }
    state.dirty = true;
  });
  handle.addEventListener('pointerup', () => { if (start){ start = null; scheduleSave(); } });
  handle.addEventListener('pointercancel', () => { start = null; });
}

function removeObj(id, kind){
  if (!confirm('Видалити?')) return;
  if (kind === 'icon') state.data.icons = state.data.icons.filter(o => o.id !== id);
  else if (kind === 'text') state.data.texts = state.data.texts.filter(o => o.id !== id);
  else if (kind === 'sticker') state.data.stickers = state.data.stickers.filter(o => o.id !== id);
  const el = document.querySelector(`.obj[data-id="${id}"]`);
  if (el) el.remove();
  state.dirty = true;
  scheduleSave();
}

function renderAllObjects(){
  objectsLayer.innerHTML = '';
  state.data.icons.forEach(o => objectsLayer.appendChild(createIconEl(o)));
  state.data.texts.forEach(o => objectsLayer.appendChild(createTextEl(o)));
  state.data.stickers.forEach(o => objectsLayer.appendChild(createStickerEl(o)));
}

function addIcon(emoji){
  const c = getVisibleCenter();
  const n = state.data.icons.length;
  const icon = { id:uid(), emoji, x:c.x + (n%5)*24, y:c.y + (n%5)*20, size:48 };
  state.data.icons.push(icon);
  objectsLayer.appendChild(createIconEl(icon));
  state.dirty = true;
  scheduleSave();
}

function addText(){
  const c = getVisibleCenter();
  const item = { id:uid(), text:'', x:c.x, y:c.y, fontSize:22, color:state.color };
  state.data.texts.push(item);
  const el = createTextEl(item);
  objectsLayer.appendChild(el);
  selectObj(item.id);
  state.dirty = true;
  scheduleSave();
  setTimeout(() => {
    const ta = el.querySelector('.obj-text__input');
    if (ta) ta.focus();
  }, 80);
}

function addSticker(){
  const c = getVisibleCenter();
  const n = state.data.stickers.length;
  const st = {
    id:uid(), text:'',
    x:c.x + (n%4)*18, y:c.y + (n%4)*18,
    color:STICKER_COLORS[n % STICKER_COLORS.length], width:180
  };
  state.data.stickers.push(st);
  const el = createStickerEl(st);
  objectsLayer.appendChild(el);
  selectObj(st.id);
  state.dirty = true;
  scheduleSave();
  setTimeout(() => {
    const ta = el.querySelector('textarea');
    if (ta) ta.focus();
  }, 80);
}

/* ═══════════ DRAWER ═══════════ */
function openDrawer(){
  app.classList.add('drawer-open');
  app.classList.remove('drawer-collapsed');
}
function closeDrawer(){
  app.classList.remove('drawer-open');
}
function toggleDrawerCollapsed(){
  app.classList.toggle('drawer-collapsed');
}

menuBtn.addEventListener('click', () => {
  if (isMobile()){
    if (app.classList.contains('drawer-open')) closeDrawer();
    else openDrawer();
  } else {
    toggleDrawerCollapsed();
  }
});
drawerBackdrop.addEventListener('click', closeDrawer);

/* ═══════════ UI BUILD ═══════════ */
function buildIconTabs(){
  iconTabs.innerHTML = '';
  Object.entries(NATURE_ICONS).forEach(([key, val]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-tab' + (key === state.activeIconTab ? ' on' : '');
    btn.textContent = val.label;
    btn.dataset.tab = key;
    btn.addEventListener('click', () => {
      state.activeIconTab = key;
      $$('.icon-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === key));
      buildIconGrid();
    });
    iconTabs.appendChild(btn);
  });
}
function buildIconGrid(){
  iconGrid.innerHTML = '';
  const list = NATURE_ICONS[state.activeIconTab]?.icons || [];
  list.forEach(emoji => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-pick';
    btn.textContent = emoji;
    btn.addEventListener('click', () => {
      addIcon(emoji);
      if (isMobile()) closeDrawer();
    });
    iconGrid.appendChild(btn);
  });
}
function buildColorSwatches(){
  colorSwatches.innerHTML = '';
  COLOR_SWATCHES.forEach(col => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'color-sw' + (col === state.color ? ' on' : '');
    b.style.background = col;
    b.dataset.color = col;
    b.addEventListener('click', () => setColor(col));
    colorSwatches.appendChild(b);
  });
}
function setColor(col){
  state.color = col;
  $$('.color-sw').forEach(s => s.classList.toggle('on', s.dataset.color === col));
  colorCustom.value = col;
}
colorCustom.addEventListener('input', e => {
  state.color = e.target.value;
  $$('.color-sw').forEach(s => s.classList.remove('on'));
});

function setTool(tool){
  if (state.tool === tool && tool !== 'idle') tool = 'idle';
  state.tool = tool;
  canvas.dataset.tool = tool;
  $$('.tool-chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === tool ? 'true' : 'false'));
  $$('.quick-btn[data-qtool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.qtool === tool ? 'true' : 'false'));
  if (tool === 'idle') clearSelection();
}

function buildBgOptions(){
  $$('.bg-opt').forEach(b => b.addEventListener('click', () => setBackground(b.dataset.bg)));
}

brushSizeEl.addEventListener('input', e => {
  state.size = Number(e.target.value);
  sizeValEl.textContent = state.size;
});

/* ═══════════ EXPORT PNG ═══════════ */
async function exportPNG(){
  if (typeof html2canvas !== 'function'){ showToast('❌ Модуль не завантажено'); return; }
  showToast('📸 Готую знімок…');
  clearSelection();
  try {
    const shot = await html2canvas(board, {
      backgroundColor: null,
      scale: Math.min(2.5, Math.max(1.5, window.devicePixelRatio || 1)),
      useCORS: true, logging: false, removeContainer: true
    });
    const name = (state.data.name || 'Записник').replace(/[^\w\u0400-\u04FF]+/g, '-').trim() || 'Записник';
    const d = new Date();
    const dateStr = d.toLocaleDateString('uk-UA', { day:'2-digit', month:'2-digit', year:'numeric' }).replace(/\./g, '-');
    const link = document.createElement('a');
    link.download = `Природа-${name}-${dateStr}.png`;
    link.href = shot.toDataURL('image/png');
    document.body.appendChild(link); link.click(); link.remove();
    showToast('✅ Збережено');
  } catch (err){
    console.warn('[Export]', err);
    showToast('❌ Помилка збереження');
  }
}

/* ═══════════ ADMIN ═══════════ */
function openAdmin(){ if (state.adminBusy) return; adminPanel.hidden = false; setAdminProgress(null); }
function closeAdmin(){ if (state.adminBusy) return; adminPanel.hidden = true; }

async function adminReload(){
  if (state.adminBusy) return;
  state.adminBusy = true;
  try {
    setAdminProgress('🔄 Читаю з сервера…', 40);
    if (!state.db || !state.ref) throw new Error('Firebase недоступний');
    const snap = await state.ref.once('value');
    const data = snap.val();
    state.dirty = false;
    if (data) applyRemoteData(data);
    setAdminProgress('✅ Готово', 100);
    await new Promise(r => setTimeout(r, 800));
    setAdminProgress(null);
  } catch (e){
    console.warn(e);
    setAdminProgress('❌ Помилка', 100);
    await new Promise(r => setTimeout(r, 1500));
    setAdminProgress(null);
  } finally { state.adminBusy = false; }
}

async function adminClearAll(){
  if (state.adminBusy) return;
  if (!confirm('⚠️ Видалити всю дошку?\n\nМалюнки, іконки, тексти, стікери буде стерто.\n\nПродовжити?')) return;
  if (!confirm('⚠️ Останнє підтвердження!\n\nТочно очистити?')) return;
  state.adminBusy = true;
  try {
    setAdminProgress('♻️ Очищаю…', 50);
    if (state.db && state.ref) await state.ref.remove();
    state.data = emptyData();
    state.lastLocalCanvas = null;
    board.dataset.bg = 'line';
    updateBgButtons();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    objectsLayer.innerHTML = '';
    if (authorInput) authorInput.value = '';
    state.dirty = false;
    setAdminProgress('✅ Все очищено', 100);
    await new Promise(r => setTimeout(r, 1200));
    setAdminProgress(null);
    showToast('✅ Дошку очищено');
  } catch (e){
    console.warn(e);
    setAdminProgress('❌ Помилка', 100);
    await new Promise(r => setTimeout(r, 1500));
    setAdminProgress(null);
  } finally { state.adminBusy = false; }
}

/* ═══════════ BIND UI ═══════════ */
function bindUI(){
  toolRow.addEventListener('click', e => {
    const b = e.target.closest('.tool-chip');
    if (b) setTool(b.dataset.tool);
  });
  $$('.quick-btn[data-qtool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.qtool)));

  $('#addTextBtn').addEventListener('click', () => { addText(); if (isMobile()) closeDrawer(); });
  $('#addStickerBtn').addEventListener('click', () => { addSticker(); if (isMobile()) closeDrawer(); });
  $('#qAddText').addEventListener('click', addText);
  $('#qAddSticker').addEventListener('click', addSticker);
  $('#qMenu').addEventListener('click', openDrawer);

  /* ВИПРАВЛЕНО: очищення */
  $('#clearBoardBtn').addEventListener('click', () => {
    if (!confirm('Очистити дошку? Все, що є — зникне.')) return;
    state.data = emptyData();
    board.dataset.bg = 'line';
    updateBgButtons();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    objectsLayer.innerHTML = '';
    // lastLocalCanvas навмисно НЕ чіпаємо — щоб flushSave побачив різницю і відправив null
    state.dirty = true;
    flushSave({ force:true });
    showToast('🗑️ Дошку очищено');
  });

  $('#syncBtn').addEventListener('click', forceSyncNow);
  $('#exportBtn').addEventListener('click', exportPNG);

  authorInput.addEventListener('input', () => {
    state.data.name = authorInput.value;
    state.dirty = true;
    scheduleSave();
  });

  // Клік по фону знімає виділення
  boardWrap.addEventListener('pointerdown', e => {
    if (e.target === boardWrap || e.target === board || e.target === canvas) clearSelection();
  });

  // Admin
  $('#authorCredit').addEventListener('click', openAdmin);
  $('#adminClose').addEventListener('click', closeAdmin);
  $('#adminReload').addEventListener('click', adminReload);
  $('#adminSavePNG').addEventListener('click', async () => { closeAdmin(); await exportPNG(); });
  $('#adminClearAll').addEventListener('click', adminClearAll);
  adminPanel.addEventListener('click', e => { if (e.target === adminPanel) closeAdmin(); });

  // Клавіші
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'b' || e.key === 'B') setTool('brush');
    else if (e.key === 'e' || e.key === 'E') setTool('eraser');
    else if (e.key === 'Escape'){ setTool('idle'); closeAdmin(); closeDrawer(); }
    else if (e.key === 'n' || e.key === 'N') addSticker();
    else if (e.key === 't' || e.key === 'T') addText();
  });

  window.addEventListener('beforeunload', () => flushSave({ force:true }));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden'){
      state.dirty = true;
      flushSave({ force:true });
    }
  });
}

/* ═══════════ RESIZE ═══════════ */
function bindResize(){
  const schedule = () => {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = null;
      resizeCanvasBacking();
    });
  };
  if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(boardWrap);
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', () => setTimeout(schedule, 250));
}

/* ═══════════ INIT ═══════════ */
function init(){
  initFirebase();
  buildIconTabs();
  buildIconGrid();
  buildColorSwatches();
  buildBgOptions();
  setColor('#2f6b42');
  setTool('idle');
  bindUI();
  attachCanvasEvents();
  bindResize();

  if (state.db) attachFirebaseListeners();
  else { netDot.dataset.online = 'false'; netDot.title = 'Firebase недоступний'; }

  requestAnimationFrame(() => {
    resizeCanvasBacking();
    if (!isMobile()) app.classList.remove('drawer-collapsed');
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>

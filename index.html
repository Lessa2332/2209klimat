<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03121f">
<meta name="color-scheme" content="dark">
<meta name="description" content="Кліматична лабораторія — спільна інтерактивна дошка з реальною географічною картою та зафарбованими кліматичними поясами.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="format-detection" content="telephone=no">
<title>🌍 Кліматична лабораторія — Кліматичні пояси</title>

<link rel="preconnect" href="https://www.gstatic.com" crossorigin>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<style>
/* ============================================================
   ДИЗАЙН-СИСТЕМА «ПОГОДА»
   ============================================================ */
:root{
  --sky-950:#03121f;
  --sky-900:#061a2b;
  --sky-850:#082136;
  --sky-800:#0a2540;
  --sky-700:#0f3a5f;
  --sky-600:#15507f;
  --sky-500:#1f6ea6;
  --sky-400:#3c9fd4;
  --rain:#4cc9f0;
  --rain-soft:#8fdcf5;
  --sun:#ffb703;
  --sun-soft:#ffd166;
  --warm:#ff6b35;
  --mint:#2ec4b6;
  --snow:#eaf4fb;
  --cloud:#cfe3f2;
  --danger:#ff5470;
  --ocean-deep:#04182e;
  --ocean-mid:#062a4a;
  --ocean-shallow:#0a3d68;
  --land:#12324f;
  --land-hi:#1d4a70;
  --land-stroke:#3a6b96;
  --text:#eaf4fb;
  --text-dim:#a8c4d8;
  --text-mute:#7d9bb3;
  --surface:rgba(10,37,64,.82);
  --surface-2:rgba(15,58,95,.9);
  --line:rgba(111,198,234,.20);
  --line-strong:rgba(111,198,234,.38);
  --r-lg:16px;
  --r-md:12px;
  --r-sm:9px;
  --tap:44px;
  --shadow-1:0 2px 10px rgba(0,0,0,.35);
  --shadow-2:0 10px 34px rgba(0,0,0,.5);
  --dur:.18s;
  --ease:cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
         "Noto Sans",Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

body{
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  color:var(--text);
  background-color:var(--sky-950);
  background-image:
    radial-gradient(1200px 620px at 12% -12%, rgba(76,201,240,.16), transparent 62%),
    radial-gradient(900px 520px at 92% -6%, rgba(255,183,3,.10), transparent 60%),
    linear-gradient(180deg,#03121f 0%,#061a2b 46%,#0a2540 100%);
  background-attachment:fixed;
  overflow:hidden;
  overscroll-behavior:none;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}

:focus{outline:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}
@media (prefers-contrast:more){
  :root{ --line:rgba(160,220,255,.55); --text-dim:#d6e9f6; }
}

.sr-only{
  position:absolute!important;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ============================================================
   КАРКАС
   ============================================================ */
.app{
  display:grid;
  grid-template-rows:auto auto auto minmax(0,1fr) auto;
  height:100vh;
  height:100dvh;
  width:100%;
}

.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  background:linear-gradient(180deg, rgba(15,58,95,.95), rgba(8,33,54,.88));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:20;
}
.app-title{
  display:flex;align-items:center;gap:8px;
  font-size:clamp(14px,3.4vw,18px);font-weight:700;letter-spacing:-.01em;
  margin:0;min-width:0;
}
.app-title__text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-title__icon{font-size:1.15em;line-height:1}
.badge{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:rgba(76,201,240,.14);border:1px solid var(--line-strong);
  color:var(--rain-soft);white-space:nowrap;
}
.header-controls{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.timer{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  font-weight:700;font-size:15px;letter-spacing:.02em;padding:7px 14px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--sun),#ff9500);color:#25180a;
  box-shadow:0 2px 12px rgba(255,183,3,.28);min-width:74px;text-align:center;
}
.timer[data-low="true"]{
  background:linear-gradient(135deg,var(--danger),#c9184a);color:#fff;
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.68}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap);min-width:var(--tap);padding:0 14px;
  border-radius:var(--r-md);font-size:14px;font-weight:600;
  border:1px solid var(--line-strong);background:rgba(15,58,95,.7);color:var(--text);
  transition:background var(--dur) var(--ease), transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
  white-space:nowrap;
}
.btn:hover{background:rgba(31,110,166,.75);border-color:var(--rain)}
.btn:active{transform:scale(.96)}
.btn--primary{
  background:linear-gradient(135deg,var(--sun),#ff9500);
  border-color:transparent;color:#25180a;font-weight:700;
}
.btn--primary:hover{filter:brightness(1.06);border-color:transparent}
.btn--ghost{background:transparent;border-color:transparent}
.btn--ghost:hover{background:rgba(76,201,240,.12);border-color:transparent}

.group-bar{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  background:rgba(6,26,43,.72);border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;z-index:15;
}
.group-bar::-webkit-scrollbar{display:none}
.group-bar__label{
  flex:0 0 auto;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-mute);margin-right:2px;
}
.group-btn{
  flex:0 0 auto;min-height:40px;padding:0 18px;border-radius:var(--r-md);
  font-size:14px;font-weight:700;border:1px solid var(--line-strong);
  background:rgba(15,58,95,.6);color:var(--text-dim);
  transition:all var(--dur) var(--ease);
}
.group-btn:hover{background:rgba(31,110,166,.7);color:#fff}
.group-btn[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--rain),#1f9ec9);
  border-color:transparent;color:#03121f;
  box-shadow:0 3px 14px rgba(76,201,240,.32);
}

.tabs{
  display:flex;gap:6px;padding:9px 12px;
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  background:rgba(10,37,64,.62);border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;z-index:14;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;scroll-snap-align:start;min-height:40px;padding:0 16px;
  border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text-dim);
  background:rgba(15,58,95,.55);border:1px solid transparent;
  transition:all var(--dur) var(--ease);white-space:nowrap;
}
.tab:hover{color:#fff;background:rgba(31,110,166,.7)}
.tab[aria-selected="true"]{
  background:linear-gradient(135deg,var(--rain),#1f9ec9);
  color:#03121f;font-weight:700;
  box-shadow:0 3px 14px rgba(76,201,240,.3);
}

/* ============================================================
   РОБОЧА ОБЛАСТЬ
   ============================================================ */
.workspace{
  display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;
}

.icon-gallery{
  display:flex;gap:8px;padding:8px 12px;
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  background:rgba(6,26,43,.85);border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;flex:0 0 auto;z-index:10;
}
.icon-gallery::-webkit-scrollbar{display:none}
.icon-item{
  flex:0 0 auto;width:var(--tap);height:var(--tap);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;line-height:1;border-radius:var(--r-md);
  background:rgba(15,58,95,.72);border:1px solid transparent;
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  user-select:none;-webkit-user-select:none;
}
.icon-item:hover{background:rgba(31,110,166,.8);border-color:var(--rain);transform:translateY(-2px)}
.icon-item:active{transform:scale(.92)}

/* ---------- КАРТА ---------- */
.map-container{
  position:relative;flex:1 1 auto;min-height:200px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, #0a3d68 0%, #062a4a 42%, #04182e 78%, #020a14 100%);
  touch-action:manipulation;
}
#svgMap{
  position:absolute;inset:0;width:100%;height:100%;display:block;
}

.ocean-sphere{fill:url(#oceanGrad)}
.ocean-glow{fill:url(#oceanGlow);pointer-events:none}

.graticule{
  fill:none;stroke:rgba(120,190,230,.10);
  stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none;
}
.graticule--major{stroke:rgba(120,190,230,.22);stroke-width:.7}

/* ============================================================
   КЛІМАТИЧНІ ПОЯСИ — ГОЛОВНА ВІЗУАЛІЗАЦІЯ
   ============================================================ */
.climate-zone{
  stroke:rgba(255,255,255,.18);
  stroke-width:.55;
  stroke-dasharray:none;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
  /* плавна зміна при наведенні */
  transition:fill-opacity .25s cubic-bezier(.4,0,.2,1),
             stroke .25s cubic-bezier(.4,0,.2,1),
             filter .25s cubic-bezier(.4,0,.2,1);
}
.climate-zone:hover{
  stroke:rgba(255,255,255,.85);
  stroke-width:1;
  filter:url(#zoneGlow);
}
.climate-zone[data-user-colored="true"]{
  stroke-dasharray:6 3;
  stroke-width:1;
}

/* Підписи поясів — завжди видимі */
.climate-zone__label{
  font-size:9.5px;
  font-weight:800;
  letter-spacing:.03em;
  paint-order:stroke;
  stroke:#0a1520;
  stroke-width:3px;
  stroke-linejoin:round;
  pointer-events:none;
  text-anchor:middle;
  font-family:var(--font);
  text-transform:uppercase;
  opacity:.95;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.climate-zone__label--small{
  font-size:7.5px;
  letter-spacing:.01em;
}
.climate-zone__label[data-visible="true"]{opacity:1}

/* Країни */
.country{
  fill:var(--land);
  stroke:var(--land-stroke);
  stroke-width:.45;
  vector-effect:non-scaling-stroke;
  transition:fill var(--dur) var(--ease), stroke var(--dur) var(--ease);
  cursor:pointer;
}
.country:hover{
  fill:var(--land-hi);
  stroke:var(--sun);
  stroke-width:1;
}
.country--has-data .country-dot{opacity:.9}

.country-dot{
  fill:var(--sun);stroke:#03121f;stroke-width:.8;
  pointer-events:none;opacity:0;
  transition:opacity var(--dur) var(--ease);
}

/* Важливі паралелі */
.lat-line{
  fill:none;stroke:rgba(255,255,255,.45);
  stroke-width:.8;stroke-dasharray:5 4;
  vector-effect:non-scaling-stroke;pointer-events:none;
}
.lat-line--equator{
  stroke:rgba(255,255,255,.85);stroke-width:1.3;stroke-dasharray:none;
}
.lat-label{
  fill:#ffffff;font-size:9px;font-weight:800;
  paint-order:stroke;stroke:#0a1520;stroke-width:3px;stroke-linejoin:round;
  pointer-events:none;font-family:var(--font);letter-spacing:.02em;
}
.lat-label--equator{fill:#ffffff}

/* Полотно малювання */
#drawCanvas{
  position:absolute;inset:0;width:100%;height:100%;z-index:2;
  touch-action:none;cursor:crosshair;display:block;
}
#drawCanvas[data-tool="eraser"]{cursor:cell}
#drawCanvas[data-tool="fill"]{pointer-events:none;cursor:pointer}

#stickersLayer{
  position:absolute;inset:0;z-index:3;pointer-events:none;
}

/* Стікери */
.sticker{
  position:absolute;width:170px;min-height:64px;padding:20px 10px 10px;
  border-radius:var(--r-md);box-shadow:var(--shadow-2);
  pointer-events:auto;color:#1b2733;touch-action:none;
  user-select:none;-webkit-user-select:none;
  transition:box-shadow var(--dur) var(--ease);
}
.sticker:hover{box-shadow:0 14px 40px rgba(0,0,0,.55)}
.sticker textarea{
  width:100%;min-height:44px;max-height:200px;border:0;background:transparent;
  resize:none;outline:none;font-size:13px;line-height:1.4;color:#1b2733;
  font-family:var(--font);overflow:hidden;display:block;
}
.sticker textarea::placeholder{color:rgba(27,39,51,.42)}
.sticker__del{
  position:absolute;top:2px;right:2px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  font-size:13px;font-weight:700;color:rgba(27,39,51,.55);
  transition:all var(--dur) var(--ease);
}
.sticker__del:hover{background:rgba(255,84,112,.9);color:#fff}

.placed-icon{
  position:absolute;font-size:34px;line-height:1;padding:4px;
  cursor:grab;pointer-events:auto;touch-action:none;
  user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.55));
  transition:transform var(--dur) var(--ease);
}
.placed-icon:active{cursor:grabbing;transform:scale(1.12)}

/* Інфо-картка */
.zone-info{
  position:absolute;top:10px;left:10px;z-index:6;
  max-width:min(360px, calc(100% - 20px));
  padding:11px 42px 11px 14px;border-radius:var(--r-md);
  border:1px solid var(--line-strong);border-left:4px solid var(--sun);
  background:rgba(6,26,43,.94);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:var(--shadow-1);font-size:13px;
  animation:fadeIn .25s var(--ease);
  max-height:calc(100% - 20px);overflow:auto;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.zone-info[hidden]{display:none}
.zone-info h2{
  margin:0 0 3px;font-size:14px;font-weight:700;
  color:var(--sun-soft);letter-spacing:-.01em;
}
.zone-info p{margin:0;color:var(--text-dim);line-height:1.4}
.zone-info__meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.zone-info__chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:rgba(76,201,240,.14);border:1px solid var(--line);
  color:var(--rain-soft);
}
.zone-info__chip--warm{background:rgba(255,183,3,.16);border-color:rgba(255,183,3,.3);color:var(--sun-soft)}
.zone-info__chip--cool{background:rgba(143,220,245,.14);border-color:rgba(143,220,245,.3);color:var(--rain-soft)}
.zone-info__hint{
  display:block;margin-top:6px;font-size:11.5px;
  color:var(--rain-soft);font-weight:600;
}
.zone-info__close{
  position:absolute;top:6px;right:6px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  font-size:14px;color:var(--text-mute);transition:all var(--dur) var(--ease);
}
.zone-info__close:hover{background:rgba(76,201,240,.16);color:#fff}

/* Легенда */
.legend{
  position:absolute;top:10px;right:10px;z-index:6;
  max-width:230px;padding:10px 12px;border-radius:var(--r-md);
  background:rgba(6,26,43,.9);border:1px solid var(--line-strong);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:11px;line-height:1.35;color:var(--text-dim);
  box-shadow:var(--shadow-1);
}
.legend h4{
  margin:0 0 6px;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;color:var(--sun-soft);
}
.legend ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.legend li{display:flex;align-items:center;gap:7px;cursor:pointer;padding:2px 0;border-radius:5px}
.legend li:hover{background:rgba(76,201,240,.08)}
.legend__swatch{
  flex:0 0 auto;width:16px;height:11px;border-radius:3px;
  border:1px solid rgba(255,255,255,.28);
}
.legend__toggle{
  position:absolute;top:6px;right:6px;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;font-size:12px;color:var(--text-mute);
  transition:all var(--dur) var(--ease);
}
.legend__toggle:hover{background:rgba(76,201,240,.16);color:#fff}
.legend[data-collapsed="true"] ul{display:none}
.legend[data-collapsed="true"]{max-width:120px}

/* Перемикач поясів */
.layers{
  position:absolute;top:10px;right:10px;z-index:7;
  display:flex;flex-direction:column;gap:6px;
}
.layer-toggle{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:999px;
  font-size:11.5px;font-weight:700;
  background:rgba(6,26,43,.9);border:1px solid var(--line-strong);
  color:var(--text-dim);
  transition:all var(--dur) var(--ease);
  box-shadow:var(--shadow-1);
}
.layer-toggle:hover{color:#fff;background:rgba(31,110,166,.85)}
.layer-toggle[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--rain),#1f9ec9);
  color:#03121f;border-color:transparent;
}

/* Статус */
.status{
  position:absolute;bottom:10px;right:10px;z-index:6;
  max-width:calc(100% - 20px);padding:8px 14px;border-radius:999px;
  font-size:12px;font-weight:700;
  background:rgba(46,196,182,.92);color:#04231f;
  box-shadow:var(--shadow-1);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.status[data-state="warn"]{background:rgba(255,183,3,.94);color:#2a1c00}
.status[data-state="error"]{background:rgba(255,84,112,.94);color:#fff}
.status[data-state="busy"]{background:rgba(76,201,240,.94);color:#03121f}

/* ============================================================
   ТУЛБАР
   ============================================================ */
.toolbar{
  display:flex;align-items:center;gap:6px;padding:8px 12px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  background:linear-gradient(180deg, rgba(8,33,54,.92), rgba(6,26,43,.98));
  border-top:1px solid var(--line);

}
.toolbar::-webkit-scrollbar{display:none}

.tool-group{

}
.tool-group:last-child{border-right:0;padding-right:0;margin-right:0}

.tool-btn{
  display:inline-flex;align-items:center;gap:6px;
  min-height:var(--tap);padding:0 14px;border-radius:var(--r-md);
  font-size:13.5px;font-weight:600;color:var(--text-dim);

}
.tool-btn:hover{background:rgba(31,110,166,.75);color:#fff}
.tool-btn:active{transform:scale(.96)}
.tool-btn[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--rain),#1f9ec9);
  color:#03121f;font-weight:700;
  box-shadow:0 3px 14px rgba(76,201,240,.3);
}

.color-swatch{
  width:34px;height:34px;border-radius:50%;
  border:3px solid transparent;
  box-shadow:0 0 0 1px rgba(255,255,255,.16) inset;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
  flex:0 0 auto;
}
.color-swatch:hover{transform:scale(1.1)}
.color-swatch[aria-pressed="true"]{
  border-color:#fff;transform:scale(1.16);
  box-shadow:0 0 0 3px rgba(255,255,255,.18);
}

input[type="color"]{
  width:var(--tap);height:34px;padding:0;
  border:2px solid var(--line-strong);border-radius:var(--r-sm);
  background:transparent;cursor:pointer;
}
input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
input[type="color"]::-webkit-color-swatch{border:0;border-radius:5px}

input[type="range"]{
  -webkit-appearance:none;appearance:none;
  width:88px;height:var(--tap);background:transparent;
  cursor:pointer;flex:0 0 auto;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--rain),var(--sun));
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;margin-top:-7px;
  border-radius:50%;background:#fff;border:2px solid var(--sky-800);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
input[type="range"]::-moz-range-track{
  height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--rain),var(--sun));
}
input[type="range"]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:2px solid var(--sky-800);
}
.size-label{
  font-size:12px;font-variant-numeric:tabular-nums;
  color:var(--text-mute);min-width:20px;text-align:center;font-weight:700;
}

function hexToRgba(hex, alpha){
  let h = String(hex).replace('#','');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  if (Number.isNaN(n)) return `rgba(255,255,255,${alpha})`;
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}

function setStatus(msg, variant){

function buildTabs(){
  const frag = document.createDocumentFragment();
  ZONES.forEach((z, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab';
    btn.textContent = z.title;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-controls', 'mapContainer');
    btn.tabIndex = i === 0 ? 0 : -1;
    btn.dataset.zone = z.id;
    btn.addEventListener('click', () => switchZone(z.id));
    frag.appendChild(btn);
  });
  tabsEl.appendChild(frag);

  tabsEl.addEventListener('keydown', e => {
    const tabs = $$('.tab', tabsEl);
    const idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    let next = -1;
    if (e.key === 'ArrowRight') next = (idx + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = tabs.length - 1;
    if (next >= 0){
      e.preventDefault();
      tabs[next].focus();
      switchZone(tabs[next].dataset.zone);
    }
  });
}

/* ============================================================
   6. РЕАЛЬНА КАРТА (D3 + TopoJSON)
   ============================================================ */
function makeLatBandPolygon(lat1, lat2){
  const coords = [];
  for (let lon = -180; lon <= 180; lon += 3) coords.push([lon, lat1]);
  for (let lon = 180; lon >= -180; lon -= 3) coords.push([lon, lat2]);
  coords.push([-180, lat1]);
  return {
    type:'Feature',
    properties:{},
    geometry:{ type:'Polygon', coordinates:[coords] }
  };
}

function getMapSize(){
  const r = mapContainer.getBoundingClientRect();
  const w = Math.max(320, Math.round(r.width));
  const h = Math.max(200, Math.round(r.height));
  return { w, h };
}

function renderMap(){
  if (typeof d3 === 'undefined' || typeof topojson === 'undefined'){
    console.warn('D3 / topojson not loaded');
    return;
  }
  const { w, h } = getMapSize();
  svgMap.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svgMap.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const svg = d3.select('#svgMap');
  const root = svg.select('#mapRoot');
  root.selectAll('*').remove();

  const projection = d3.geoEquirectangular()
    .fitExtent([[6, 6], [w - 6, h - 6]], { type:'Sphere' });
  const path = d3.geoPath(projection);

  /* 1. Океан */
  root.append('path')
    .datum({ type:'Sphere' })
    .attr('class', 'ocean-sphere')
    .attr('d', path);

  root.append('path')
    .datum({ type:'Sphere' })
    .attr('class', 'ocean-glow')
    .attr('d', path);

  /* 2. Сітка */
  const grat = d3.geoGraticule().step([30, 30]);
  root.append('path')
    .datum(grat())
    .attr('class', 'graticule')
    .attr('d', path);

  const gratMajor = d3.geoGraticule().step([60, 30]);
  root.append('path')
    .datum(gratMajor())
    .attr('class', 'graticule graticule--major')
    .attr('d', path);

  /* 3. Країни — малюємо ПЕРЕД поясами, щоб пояси були ЗВЕРХУ */
  const countriesG = root.append('g').attr('class', 'countries');
  const drawCountries = (geo) => {
    countriesG.selectAll('path.country')
      .data(geo.features)
      .enter()
      .append('path')
      .attr('class', d => {
        const key = normalizeName(d.properties?.name || '');
        return 'country' + (COUNTRY_CLIMATE_BY_KEY.has(key) ? ' country--has-data' : '');
      })
      .attr('data-country', d => d.properties?.name || '')
      .attr('d', path);

    // Крапки-маркери для країн із даними
    countriesG.selectAll('circle.country-dot')
      .data(geo.features.filter(d => COUNTRY_CLIMATE_BY_KEY.has(normalizeName(d.properties?.name || ''))))
      .enter()
      .append('circle')
      .attr('class', 'country-dot')
      .attr('cx', d => path.centroid(d)[0])
      .attr('cy', d => path.centroid(d)[1])
      .attr('r', 1.7);

    state.mapReady = true;
  };

  if (state.countriesGeo){
    drawCountries(state.countriesGeo);
  } else {
    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(world => {
        const geo = topojson.feature(world, world.objects.countries);
        state.countriesGeo = geo;
        const { w: w2, h: h2 } = getMapSize();
        if (w2 !== w || h2 !== h){ renderMap(); return; }
        drawCountries(geo);
      })
      .catch(err => {
        console.error('Map load error:', err);
        flashStatus('⚠️ Карту не завантажено — перевірте інтернет', 'error', 6000);
        state.mapReady = true;
      });
  }

  /* 4. КЛІМАТИЧНІ ПОЯСИ — ЗВЕРХУ над картою, з кольором */
  const zonesG = root.append('g').attr('class', 'climate-zones');

  CLIMATE_BANDS.forEach(band => {
    const feat = makeLatBandPolygon(band.lat[0], band.lat[1]);
    zonesG.append('path')
      .datum(feat)
      .attr('class', 'climate-zone')
      .attr('data-zone', band.id)
      .attr('data-name', band.name)
      .attr('data-user-colored', 'false')
      .attr('d', path)
      .attr('fill', band.color)
      .attr('fill-opacity', ZONE_BASE_OPACITY)
      .attr('stroke', 'rgba(255,255,255,.18)')
      .attr('stroke-width', 0.55);
  });

  /* 5. Підписи поясів — ЗАВЖДИ видимі */
  const labelsG = root.append('g').attr('class', 'climate-labels');
  CLIMATE_BANDS.forEach(band => {
    const latMid = (band.lat[0] + band.lat[1]) / 2;
    const center = projection([0, latMid]);
    if (!center) return;
    const span = Math.abs(band.lat[1] - band.lat[0]);
    const isSmall = span < 12;
    labelsG.append('text')
      .attr('class', 'climate-zone__label' + (isSmall ? ' climate-zone__label--small' : ''))
      .attr('x', center[0])
      .attr('y', center[1] + 3)
      .attr('data-zone', band.id)
      .attr('fill', band.color)
      .attr('data-visible', 'true')
      .text(isSmall ? band.short : band.name);
  });

  /* 6. Важливі паралелі — найтонший шар поверх */
  const latG = root.append('g').attr('class', 'lat-lines');
  LAT_LINES.forEach(line => {
    const feat = makeLatBandPolygon(line.lat - 0.06, line.lat + 0.06);
    latG.append('path')
      .datum(feat)
      .attr('class', 'lat-line' + (line.equator ? ' lat-line--equator' : ''))
      .attr('d', path);

    const p = projection([-172, line.lat]);
    if (p){
      latG.append('text')
        .attr('class', 'lat-label' + (line.equator ? ' lat-label--equator' : ''))
        .attr('x', p[0])
        .attr('y', p[1] - 3)
        .text(line.label);
    }
  });

  // Застосовуємо поточні налаштування шарів
  applyZoneFills();
  applyLayerVisibility();
}

function normalizeName(s){
  return String(s || '').toLowerCase()
    .replace(/^the\s+/, '')
    .replace(/[^a-z]/g, '');
}
const COUNTRY_CLIMATE_BY_KEY = new Map(
  Object.entries(COUNTRY_CLIMATE).map(([k, v]) => [normalizeName(k), v])
);

function applyZoneFills(){
  const svg = d3.select('#svgMap');

  svg.selectAll('.climate-zone').each(function(){
    const el = d3.select(this);
    const id = el.attr('data-zone');
    const userColor = state.data.zoneFills[id];
    const band = CLIMATE_BANDS.find(b => b.id === id);

    if (userColor){
      el.attr('fill', userColor)
        .attr('fill-opacity', ZONE_USER_OPACITY)
        .attr('stroke', userColor)
        .attr('stroke-width', 1.2)
        .attr('stroke-dasharray', '5 3')
        .attr('data-user-colored', 'true');
      el.style('filter', 'drop-shadow(0 0 4px ' + hexToRgba(userColor, .55) + ')');
    } else {
      el.attr('fill', band ? band.color : '#fff')
        .attr('fill-opacity', ZONE_BASE_OPACITY)
        .attr('stroke', 'rgba(255,255,255,.18)')
        .attr('stroke-width', 0.55)
        .attr('stroke-dasharray', null)
        .attr('data-user-colored', 'false');
      el.style('filter', null);
    }
  });

  // Оновлюємо колір підпису, якщо пояс зафарбовано користувачем
  svg.selectAll('.climate-zone__label').each(function(){
    const el = d3.select(this);
    const id = el.attr('data-zone');
    const userColor = state.data.zoneFills[id];
    const band = CLIMATE_BANDS.find(b => b.id === id);
    el.attr('fill', userColor || (band ? band.color : '#fff'));
  });
}

function attachMapEvents(){
  svgMap.addEventListener('click', e => {
    const zoneEl = e.target.closest?.('.climate-zone');
    if (zoneEl){
      const band = CLIMATE_BANDS.find(b => b.id === zoneEl.dataset.zone);
      if (state.tool === 'fill'){
        const id = zoneEl.dataset.zone;
        if (state.data.zoneFills[id] === state.color){
          delete state.data.zoneFills[id];
        } else {
          state.data.zoneFills[id] = state.color;
        }
        applyZoneFills();
        state.dirtyBoard = true;
        scheduleSave('board');
      }
      if (band) showClimateInfo(band);
      return;
    }
    const country = e.target.closest?.('.country');
    if (country){
      showCountryInfo(country.dataset.country);
    }
  });
}

function showClimateInfo(band){
  zoneInfoEl.hidden = false;
  zoneInfoTitle.textContent = band.name + ' пояс';
  zoneInfoDesc.textContent  = band.desc;
  const span = Math.abs(band.lat[1] - band.lat[0]);
  zoneInfoMeta.innerHTML = `
    <span class="zone-info__chip zone-info__chip--cool">Широта: ${band.lat[0]}°…${band.lat[1]}°</span>
    <span class="zone-info__chip">Ширина: ≈${span.toFixed(1)}°</span>
  `;
  updateZoneHint();
}

function showCountryInfo(rawName){
  const key = normalizeName(rawName);
  const data = COUNTRY_CLIMATE_BY_KEY.get(key);
  zoneInfoEl.hidden = false;

  if (data){
    zoneInfoTitle.textContent = `🌍 ${data.uk}`;
    zoneInfoDesc.textContent  = data.note;
    zoneInfoMeta.innerHTML = `
      <span class="zone-info__chip">🌡 ${data.t}</span>
      <span class="zone-info__chip zone-info__chip--cool">💧 ${data.rain}</span>
      <span class="zone-info__chip zone-info__chip--warm">${data.zone}</span>
    `;
  } else {
    zoneInfoTitle.textContent = `🌍 ${rawName || 'Країна'}`;
    zoneInfoDesc.textContent  = 'Дані для цієї країни не внесені до довідника. Скористайтеся кліматичними поясами для аналізу.';
    zoneInfoMeta.innerHTML = '';
  }
  updateZoneHint();
}

function updateZoneHint(){
  const hints = {
    brush:  '✏️ Малюйте пальцем або мишкою по карті.',
    eraser: '🧽 Проведіть по лінії, щоб стерти.',
    fill:   '🎨 Торкніться кліматичного поясу, щоб зафарбувати його власним кольором.'
  };
  zoneInfoHint.textContent = hints[state.tool] || '';
}

function resizeCanvasBacking(){
  const rect = canvas.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(rect.width  * dpr);
  const h = Math.round(rect.height * dpr);
  if (canvas.width === w && canvas.height === h) return;
  canvas.width  = w;
  canvas.height = h;
  renderCanvas(state.data.canvas);
}

function renderCanvas(url){
  const token = ++canvasRenderToken;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!url) return;
  const img = new Image();
  img.decoding = 'async';
  img.onload = () => {
    if (token !== canvasRenderToken) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = url;
}

function encodeCanvas(){
  try {
    const webp = canvas.toDataURL('image/webp', 0.82);
    if (webp && webp.indexOf('data:image/webp') === 0) return webp;
  } catch (_){}
  return canvas.toDataURL('image/png');
}

function getCanvasPoint(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

let lastX = 0, lastY = 0;
function beginStroke(e){
  if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
  state.isDrawing = true;
  canvas.setPointerCapture?.(e.pointerId);
  const p = getCanvasPoint(e);
  lastX = p.x; lastY = p.y;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = state.size;
  if (state.tool === 'eraser'){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = state.color;
  }
  ctx.beginPath();
  ctx.arc(p.x, p.y, state.size / 2, 0, Math.PI * 2);
  ctx.fillStyle = state.tool === 'eraser' ? 'rgba(0,0,0,1)' : state.color;
  ctx.fill();
}
function moveStroke(e){
  if (!state.isDrawing) return;
  const p = getCanvasPoint(e);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = state.size;
  if (state.tool === 'eraser'){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = state.color;
  }
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x; lastY = p.y;
}
function endStroke(){
  if (!state.isDrawing) return;
  state.isDrawing = false;
  ctx.globalCompositeOperation = 'source-over';
  const url = encodeCanvas();
  state.data.canvas = url;
  state.lastLocalCanvas = url;
  state.dirtyDrawing = true;
  scheduleSave('drawing');
  if (state.pendingCanvas !== undefined){
    const pending = state.pendingCanvas;
    state.pendingCanvas = undefined;
    if (pending !== url) renderCanvas(pending);
  }
}

function attachCanvasEvents(){
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') e.preventDefault();
    beginStroke(e);
  });
  canvas.addEventListener('pointermove', moveStroke);
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('lostpointercapture', endStroke);
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive:false });
  canvas.addEventListener('touchmove',  e => e.preventDefault(), { passive:false });
}

/* ============================================================
   10. СТІКЕРИ
   ============================================================ */
const findSticker = id => state.data.stickers.find(s => s.id === id);
const findIcon    = id => state.data.icons.find(i => i.id === id);

function createStickerEl(s){
  const el = document.createElement('div');
  el.className = 'sticker';
  el.dataset.id = s.id;
  el.style.left = s.x + 'px';
  el.style.top  = s.y + 'px';
  el.style.background = s.color;

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'sticker__del';
  del.setAttribute('aria-label', 'Видалити стікер');
  del.textContent = '✕';

  const ta = document.createElement('textarea');
  ta.value = s.text || '';
  ta.placeholder = 'Пишіть…';
  ta.setAttribute('aria-label', 'Текст стікера');
  ta.rows = 2;

  const autosize = () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  };
  ta.addEventListener('input', () => {
    const t = findSticker(s.id);
    if (t) t.text = ta.value;
    autosize();
    state.dirtyBoard = true;
    scheduleSave('board');
  });
  ta.addEventListener('keydown', e => e.stopPropagation());

  del.addEventListener('click', e => {
    e.stopPropagation();
    state.data.stickers = state.data.stickers.filter(x => x.id !== s.id);
    stickerEls.get(s.id)?.remove();
    stickerEls.delete(s.id);
    state.dirtyBoard = true;
    scheduleSave('board');
  });

  let drag = null;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('textarea, button')) return;
    const rect = stickersLayer.getBoundingClientRect();
    const t = findSticker(s.id);
    if (!t) return;
    drag = { pointerId:e.pointerId, dx:e.clientX - rect.left - t.x, dy:e.clientY - rect.top - t.y };
    el.setPointerCapture?.(e.pointerId);
    el.style.cursor = 'grabbing';
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const rect = stickersLayer.getBoundingClientRect();
    const t = findSticker(s.id);
    if (!t) return;
    t.x = Math.max(-20, Math.min(rect.width  - 40, e.clientX - rect.left - drag.dx));
    t.y = Math.max(-10, Math.min(rect.height - 30, e.clientY - rect.top  - drag.dy));
    el.style.left = t.x + 'px';
    el.style.top  = t.y + 'px';
  });
  const stopDrag = e => {
    if (!drag || (e && e.pointerId !== drag.pointerId)) return;
    drag = null;
    el.style.cursor = '';
    state.dirtyBoard = true;
    scheduleSave('board');
  };
  el.addEventListener('pointerup', stopDrag);
  el.addEventListener('pointercancel', stopDrag);
  el.addEventListener('lostpointercapture', stopDrag);

  el.append(del, ta);
  requestAnimationFrame(autosize);
  return el;
}

function renderStickers(list){
  const seen = new Set();
  list.forEach(s => {
    seen.add(s.id);
    let el = stickerEls.get(s.id);
    if (!el){
      el = createStickerEl(s);
      stickerEls.set(s.id, el);
      stickersLayer.appendChild(el);
    } else {
      el.style.left = s.x + 'px';
      el.style.top  = s.y + 'px';
      el.style.background = s.color;
      const ta = el.querySelector('textarea');
      if (ta && document.activeElement !== ta && ta.value !== (s.text || '')) ta.value = s.text || '';
    }
  });
  stickerEls.forEach((el, id) => {
    if (!seen.has(id)){ el.remove(); stickerEls.delete(id); }
  });
}

function addSticker(){
  const rect = mapContainer.getBoundingClientRect();
  const n = state.data.stickers.length;
  const s = {
    id: uid(),
    x: Math.max(10, Math.round(rect.width  / 2 - 85 + (n % 4) * 16)),
    y: Math.max(10, Math.round(rect.height / 2 - 32 + (n % 4) * 16)),
    text: '',
    color: STICKER_COLORS[n % STICKER_COLORS.length]
  };
  state.data.stickers.push(s);
  renderStickers(state.data.stickers);
  state.dirtyBoard = true;
  scheduleSave('board');
  stickerEls.get(s.id)?.querySelector('textarea')?.focus();
}

/* ============================================================
   11. ІКОНКИ
   ============================================================ */
function createIconEl(icon){
  const el = document.createElement('div');
  el.className = 'placed-icon';
  el.dataset.id = icon.id;
  el.textContent = icon.icon;
  el.style.left = icon.x + 'px';
  el.style.top  = icon.y + 'px';
  el.tabIndex = 0;
  el.setAttribute('role', 'img');
  el.setAttribute('aria-label', `Іконка «${icon.icon}». Стрілки — перемістити, Delete — видалити.`);

  let drag = null;
  el.addEventListener('pointerdown', e => {
    const rect = stickersLayer.getBoundingClientRect();
    const t = findIcon(icon.id);
    if (!t) return;
    drag = { pointerId:e.pointerId, dx:e.clientX - rect.left - t.x, dy:e.clientY - rect.top - t.y };
    el.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const rect = stickersLayer.getBoundingClientRect();
    const t = findIcon(icon.id);
    if (!t) return;
    t.x = Math.max(-10, Math.min(rect.width  - 20, e.clientX - rect.left - drag.dx));
    t.y = Math.max(-10, Math.min(rect.height - 20, e.clientY - rect.top  - drag.dy));
    el.style.left = t.x + 'px';
    el.style.top  = t.y + 'px';
  });
  const stopDrag = e => {
    if (!drag || (e && e.pointerId !== drag.pointerId)) return;
    drag = null;
    state.dirtyBoard = true;
    scheduleSave('board');
  };
  el.addEventListener('pointerup', stopDrag);
  el.addEventListener('pointercancel', stopDrag);
  el.addEventListener('lostpointercapture', stopDrag);

  el.addEventListener('keydown', e => {
    const t = findIcon(icon.id);
    if (!t) return;
    const step = e.shiftKey ? 12 : 3;
    let handled = true;
    switch (e.key){
      case 'ArrowLeft':  t.x -= step; break;
      case 'ArrowRight': t.x += step; break;
      case 'ArrowUp':    t.y -= step; break;
      case 'ArrowDown':  t.y += step; break;
      case 'Delete':
      case 'Backspace':
        state.data.icons = state.data.icons.filter(i => i.id !== icon.id);
        iconEls.get(icon.id)?.remove();
        iconEls.delete(icon.id);
        state.dirtyBoard = true;
        scheduleSave('board');
        el.blur();
        return;
      default: handled = false;
    }
    if (handled){
      e.preventDefault();
      el.style.left = t.x + 'px';
      el.style.top  = t.y + 'px';
      state.dirtyBoard = true;
      scheduleSave('board');
    }
  });

  el.addEventListener('dblclick', () => {
    state.data.icons = state.data.icons.filter(i => i.id !== icon.id);
    el.remove();
    iconEls.delete(icon.id);
    state.dirtyBoard = true;
    scheduleSave('board');
  });

  return el;
}

function renderIcons(list){
  const seen = new Set();
  list.forEach(icon => {
    seen.add(icon.id);
    let el = iconEls.get(icon.id);
    if (!el){
      el = createIconEl(icon);
      iconEls.set(icon.id, el);
      stickersLayer.appendChild(el);
    } else {
      el.style.left = icon.x + 'px';
      el.style.top  = icon.y + 'px';
    }
  });
  iconEls.forEach((el, id) => {
    if (!seen.has(id)){ el.remove(); iconEls.delete(id); }
  });
}

function addIcon(emoji){
  const rect = mapContainer.getBoundingClientRect();
  const n = state.data.icons.length;
  const icon = {
    id: uid(),
    icon: emoji,
    x: Math.max(10, Math.round(rect.width  / 2 - 20 + (n % 6) * 18)),
    y: Math.max(10, Math.round(rect.height / 2 - 20 + (n % 6) * 18))
  };
  state.data.icons.push(icon);
  renderIcons(state.data.icons);
  state.dirtyBoard = true;
  scheduleSave('board');
  flashStatus(`${emoji} додано на карту`, 'busy', 1400);
}

/* ============================================================
   12. РЕНДЕР
   ============================================================ */
function renderBoard(){
  renderStickers(state.data.stickers);
  renderIcons(state.data.icons);
  applyZoneFills();
}

/* ============================================================
   13. FIREBASE
   ============================================================ */
const refsFor = (g, z) => {
  const base = `groups/group${g}/zones/${z}`;
  return { drawing: db.ref(base + '/drawing'), board: db.ref(base + '/board') };
};

function detachListeners(){
  if (state.refDrawing && state.handlerDrawing)
    state.refDrawing.off('value', state.handlerDrawing);
  if (state.refBoard && state.handlerBoard)
    state.refBoard.off('value', state.handlerBoard);
  state.refDrawing = state.refBoard = null;
  state.handlerDrawing = state.handlerBoard = null;
}

function attachListeners(){
  if (!db) return;
  const r = refsFor(state.group, state.zone);
  state.refDrawing = r.drawing;
  state.refBoard   = r.board;

  state.handlerDrawing = r.drawing.on('value', snap => {
    const url = snap.val() || null;
    if (url === state.lastLocalCanvas) return;
    if (state.isDrawing){ state.pendingCanvas = url; return; }
    state.data.canvas = url;
    renderCanvas(url);
  }, err => console.error('drawing listener:', err));

  state.handlerBoard = r.board.on('value', snap => {
    const data = snap.val();
    if (!data) return;
    if (state.dirtyBoard) return;
    state.data.stickers  = Array.isArray(data.stickers) ? data.stickers : [];
    state.data.icons     = Array.isArray(data.icons)    ? data.icons    : [];
    state.data.zoneFills = data.zoneFills || {};
    renderBoard();
  }, err => console.error('board listener:', err));
}

function scheduleSave(kind){
  clearTimeout(state.saveTimer[kind]);
  state.saveTimer[kind] = setTimeout(() => flushSave(kind), kind === 'drawing' ? 900 : 450);
}

function flushSave(kind){
  if (!db) return;
  const kinds = kind ? [kind] : ['drawing', 'board'];

  if (kinds.includes('drawing') && state.dirtyDrawing && state.refDrawing){
    state.lastLocalCanvas = state.data.canvas;
    state.refDrawing.set(state.data.canvas || null)
      .then(() => { state.dirtyDrawing = false; })
      .catch(err => { console.error('drawing save:', err); flashStatus('⚠️ Не збережено', 'error'); });
  }

  if (kinds.includes('board') && state.dirtyBoard && state.refBoard){
    state.refBoard.set({
      stickers: state.data.stickers,
      icons: state.data.icons,
      zoneFills: state.data.zoneFills,
      updatedAt: Date.now(),
      by: CLIENT_ID
    }).then(() => { state.dirtyBoard = false; })
      .catch(err => { console.error('board save:', err); flashStatus('⚠️ Не збережено', 'error'); });
  }
}

/* ============================================================
   14. ПЕРЕМИКАННЯ
   ============================================================ */
function openBoard(group, zone){
  flushSave();
  detachListeners();
  state.group = group;
  state.zone  = zone;
  state.data  = emptyData();
  state.dirtyDrawing = state.dirtyBoard = false;
  state.lastLocalCanvas = null;

  stickerEls.forEach(el => el.remove()); stickerEls.clear();
  iconEls.forEach(el => el.remove());    iconEls.clear();
  renderCanvas(null);
  renderBoard();
  attachListeners();
}

function switchGroup(group){
  if (group === state.group && state.refDrawing) return;
  openBoard(group, state.zone);
  $('#currentGroupNum').textContent = group;
  $$('.group-btn').forEach(b => {
    b.setAttribute('aria-pressed', Number(b.dataset.group) === group ? 'true' : 'false');
  });
  flashStatus(`👥 Група ${group} — завантажено`, 'busy', 1800);
}

function switchZone(zoneId){
  if (zoneId === state.zone && state.refDrawing) return;
  openBoard(state.group, zoneId);

  const zone = ZONES.find(z => z.id === zoneId) || ZONES[0];
  zoneInfoTitle.textContent = zone.title;
  zoneInfoDesc.textContent  = zone.desc;
  zoneInfoMeta.innerHTML    = '';
  zoneInfoEl.hidden = false;
  updateZoneHint();

  $$('.tab', tabsEl).forEach(t => {
    const active = t.dataset.zone === zoneId;
    t.setAttribute('aria-selected', active ? 'true' : 'false');
    t.tabIndex = active ? 0 : -1;
  });
}

/* ============================================================
   15. ТАЙМЕР
   ============================================================ */
let timerInterval = null;
function updateTimerDisplay(){
  const remaining = Math.max(0, TOTAL_TIMER_SECONDS - state.timerSeconds);
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  timerEl.dataset.low = remaining <= 300 ? 'true' : 'false';
}
function startTimer(){
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.timerRunning) return;
    if (state.timerSeconds >= TOTAL_TIMER_SECONDS) return;
    state.timerSeconds++;
    updateTimerDisplay();
    const remaining = TOTAL_TIMER_SECONDS - state.timerSeconds;
    if (remaining === 300 || remaining === 60){
      flashStatus(`⏰ Залишилося ${remaining / 60} хв!`, 'warn', 5000);
    }
    if (remaining === 0) flashStatus('⏰ Час вийшов!', 'error', 8000);
  }, 1000);
}
function toggleTimer(){
  state.timerRunning = !state.timerRunning;
  const btn = $('#timerBtn');
  btn.setAttribute('aria-pressed', state.timerRunning ? 'false' : 'true');
  btn.setAttribute('aria-label', state.timerRunning ? 'Пауза таймера' : 'Продовжити таймер');
  $('#timerBtnIcon').textContent = state.timerRunning ? '⏸' : '▶';
}

/* ============================================================
   16. ЕКСПОРТ
   ============================================================ */
async function exportPNG(){
  if (typeof html2canvas !== 'function'){
    flashStatus('❌ Модуль експорту не завантажено', 'error');
    return;
  }
  flashStatus('📸 Створюємо знімок…', 'busy', 8000);
  try {
    const shot = await html2canvas(mapContainer, {
      backgroundColor: '#04182e',
      scale: Math.min(2, Math.max(1.5, window.devicePixelRatio || 1)),
      useCORS: true, logging: false, removeContainer: true
    });
    const link = document.createElement('a');
    link.download = `climate-g${state.group}-${state.zone}-${Date.now()}.png`;
    link.href = shot.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();
    flashStatus('✅ PNG збережено', 'ok', 3000);
  } catch (err){
    console.error('export error:', err);
    flashStatus('❌ Не вдалося зберегти', 'error', 4000);
  }
}

/* ============================================================
   17. ОЧИЩЕННЯ
   ============================================================ */
function clearCurrent(){
  const zoneName = (ZONES.find(z => z.id === state.zone) || {}).title || '';
  if (!window.confirm(`Очистити «${zoneName}» для групи ${state.group}?`)) return;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  state.data.canvas = null;
  state.data.stickers = [];
  state.data.icons = [];
  state.data.zoneFills = {};
  state.lastLocalCanvas = null;
  stickerEls.forEach(el => el.remove()); stickerEls.clear();
  iconEls.forEach(el => el.remove());    iconEls.clear();
  applyZoneFills();
  state.dirtyDrawing = true;
  state.dirtyBoard = true;
  flushSave();
  flashStatus('🗑 Дошку очищено (пояси повернуто)', 'warn', 2400);
}

/* ============================================================
   19. UI
   ============================================================ */
function bindUI(){
  $$('.tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool));
  });
  $$('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => setColor(sw.dataset.color, sw));
  });
  $('#colorPicker').addEventListener('input', e => setColor(e.target.value));

  const sizeInput = $('#brushSize');
  sizeInput.addEventListener('input', e => {
    state.size = Number(e.target.value);
    $('#sizeLabel').textContent = state.size;
    sizeInput.setAttribute('aria-valuenow', state.size);
  });

  $$('.group-btn').forEach(btn => {
    btn.addEventListener('click', () => switchGroup(Number(btn.dataset.group)));
  });

  $('#addStickerBtn').addEventListener('click', addSticker);
  $('#clearBtn').addEventListener('click', clearCurrent);
  $('#timerBtn').addEventListener('click', toggleTimer);
  $('#exportBtn').addEventListener('click', exportPNG);
  $('#zoneInfoClose').addEventListener('click', () => { zoneInfoEl.hidden = true; });

  // Перемикачі шарів
  const zonesToggle = $('#zonesToggle');
  zonesToggle.addEventListener('click', () => {
    state.zonesVisible = !state.zonesVisible;
    zonesToggle.setAttribute('aria-pressed', state.zonesVisible ? 'true' : 'false');
    applyLayerVisibility();
    flashStatus(state.zonesVisible ? '🎨 Пояси увімкнено' : '🎨 Пояси вимкнено', 'busy', 1400);
  });

  const labelsToggle = $('#labelsToggle');
  labelsToggle.addEventListener('click', () => {
    state.labelsVisible = !state.labelsVisible;
    labelsToggle.setAttribute('aria-pressed', state.labelsVisible ? 'true' : 'false');
    applyLayerVisibility();
    flashStatus(state.labelsVisible ? '🔤 Підписи увімкнено' : '🔤 Підписи вимкнено', 'busy', 1400);
  });

  // Легенда
  const legend = $('#legend');
  const legendToggle = $('#legendToggle');
  legendToggle.addEventListener('click', () => {
    const collapsed = legend.dataset.collapsed === 'true';
    legend.dataset.collapsed = collapsed ? 'false' : 'true';
    legendToggle.textContent = collapsed ? '−' : '+';
    legendToggle.setAttribute('aria-expanded', collapsed ? 'true' : 'false');
    legendToggle.setAttribute('aria-label', collapsed ? 'Згорнути легенду' : 'Розгорнути легенду');
  });

  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'b' || e.key === 'B') setTool('brush');
    else if (e.key === 'e' || e.key === 'E') setTool('eraser');
    else if (e.key === 'f' || e.key === 'F') setTool('fill');
    else if (e.key === 'n' || e.key === 'N') addSticker();
    else if (e.key === 'z' || e.key === 'Z') {
      state.zonesVisible = !state.zonesVisible;
      zonesToggle.setAttribute('aria-pressed', state.zonesVisible ? 'true' : 'false');
      applyLayerVisibility();
    } else if (e.key === 'l' || e.key === 'L') {
      state.labelsVisible = !state.labelsVisible;
      labelsToggle.setAttribute('aria-pressed', state.labelsVisible ? 'true' : 'false');
      applyLayerVisibility();
    }
  });

  window.addEventListener('beforeunload', () => flushSave());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
  });
}

function bindResize(){
  const schedule = () => {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = null;
      resizeCanvasBacking();
      renderMap();
    });
  };
  if ('ResizeObserver' in window){
    new ResizeObserver(schedule).observe(mapContainer);
  }
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', () => setTimeout(schedule, 250));
}

/* ============================================================
   20. ІНІЦІАЛІЗАЦІЯ
   ============================================================ */
function init(){
  buildIconGallery();
  buildTabs();
  buildLegend();
  bindUI();
  bindConnection();
  attachCanvasEvents();
  attachMapEvents();
  bindResize();

  setTool('brush');
  setColor('#ffb703');

  openBoard(1, ZONES[0].id);
  switchZone(ZONES[0].id);

  requestAnimationFrame(() => {
    renderMap();
    resizeCanvasBacking();
    renderCanvas(state.data.canvas);
  });

  startTimer();
  updateZoneHint();
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
